<style>
:root{--red:#a3242b;--deep:#6e1116;--gold:#c9a063;--paper:#f4ecdd;--ink:#3a2e26}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;background:#1a1214;color:var(--ink);overflow:hidden}
#deck{height:100%;position:relative;overflow:hidden;scroll-behavior:auto;overscroll-behavior:none;touch-action:none}
#deck::-webkit-scrollbar{display:none}
.scene{position:relative;height:100vh;height:100dvh;overflow:hidden;background:#111}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(20,8,8,.38) 100%)}
/* ---------- 全幕统一圆形扩散光圈；透明点击区域不再显示白框 ---------- */
.hot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;z-index:5;background:transparent;touch-action:manipulation}
.hot:active{background:transparent;filter:brightness(1.25)}
.hot .ring{position:absolute;left:50%;top:50%;width:var(--ring-size,clamp(30px,8vw,50px));height:var(--ring-size,clamp(30px,8vw,50px));transform:translate(-50%,-50%);border:1.5px solid rgba(255,247,232,.94);border-radius:50%;box-shadow:0 0 0 1px rgba(113,52,42,.5),0 0 10px rgba(255,220,170,.72),inset 0 0 5px rgba(255,240,220,.42);pointer-events:none}
.tour-entry{overflow:visible;text-decoration:none;color:inherit}
.tour-label{position:absolute;left:calc(50% + 18px);top:50%;transform:translateY(-50%);z-index:1;padding:7px 10px;border:1px solid rgba(255,230,188,.8);border-radius:999px;background:rgba(25,18,16,.78);color:#fff7e9;font-size:clamp(11px,3.2vw,13px);line-height:1.25;letter-spacing:.04em;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.45);box-shadow:0 2px 10px rgba(0,0,0,.28)}
.hot .ring:before,.hot .ring:after{content:"";position:absolute;inset:-1px;border:1.5px solid rgba(255,236,207,.98);border-radius:50%;box-shadow:0 0 0 1px rgba(105,40,32,.32),0 0 12px rgba(255,225,174,.82);opacity:0;animation:ring 2.8s ease-out infinite paused}
.hot .ring:after{animation-delay:1.4s}
.scene.is-current .hot .ring:before,.scene.is-current .hot .ring:after{animation-play-state:running}
@keyframes ring{0%{opacity:0;transform:scale(.32)}15%{opacity:.9}72%{opacity:.62;transform:scale(.82)}100%{opacity:0;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.scene.is-current .hot .ring:before,.scene.is-current .hot .ring:after{animation:none;opacity:.55;transform:scale(.72)}}
/* ---------- 章节标题 ---------- */
.chapter-tag{position:absolute;top:2.2%;left:50%;transform:translateX(-50%);z-index:4;background:linear-gradient(180deg,rgba(20,10,10,.62),rgba(20,10,10,.32));color:#f7ecd8;padding:.45em 1.4em;border-radius:999px;font-size:14px;letter-spacing:.35em;text-shadow:0 1px 2px rgba(0,0,0,.6);border:1px solid rgba(201,160,99,.55);white-space:nowrap}
/* ---------- 气泡 / 提示 ---------- */
#toast{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);z-index:900;background:rgba(24,12,12,.88);color:#f7ecd8;padding:.9em 1.5em;border-radius:14px;font-size:15px;letter-spacing:.12em;border:1px solid rgba(201,160,99,.5);max-width:82vw;text-align:center;line-height:1.7;opacity:0;pointer-events:none;transition:opacity .35s}
#toast.show{opacity:1}
#storyModal{position:fixed;inset:0;z-index:1200;display:none;place-items:center;padding:12vw;background:rgba(18,10,14,.8);color:#f8ecd8;text-align:center}
#storyModal.show{display:grid}
.story-copy{width:min(78vw,460px);animation:storyIn .45s ease both}
.story-kicker{font-size:12px;letter-spacing:.5em;color:#e5c58c;margin-bottom:18px}
.story-title{font-size:clamp(24px,7vw,34px);letter-spacing:.22em;font-weight:400}
.story-text{margin-top:22px;font-size:15px;line-height:2.1;letter-spacing:.1em;color:rgba(248,236,216,.9)}
#storyClose{position:absolute;top:calc(18px + env(safe-area-inset-top));right:20px;width:42px;height:42px;border:0;background:transparent;color:#f8ecd8;font-size:30px;font-weight:200;cursor:pointer}
@keyframes storyIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.falling-petal{position:absolute;z-index:8;width:var(--petal-w,15px);height:var(--petal-h,23px);border-radius:100% 0 100% 0;background:linear-gradient(145deg,#fff2ec 0%,#f2a1a6 54%,#c95469 100%);box-shadow:0 1px 4px rgba(104,24,42,.2);pointer-events:none;will-change:transform,opacity;animation:petalFall var(--petal-time,5s) cubic-bezier(.24,.55,.55,.95) var(--petal-delay,0s) both}
@keyframes petalFall{0%{opacity:0;transform:translate3d(0,-12px,0) rotate(0) scale(.8)}12%{opacity:.95}100%{opacity:0;transform:translate3d(var(--petal-drift,12vw),calc(100vh + 120px),0) rotate(var(--petal-turn,420deg)) scale(.65)}}
.love-light{position:absolute;inset:0;z-index:3;opacity:0;visibility:hidden;pointer-events:none}
.love-light.play{visibility:visible;animation:lightWash 2.8s ease-out forwards}
.love-light-beam{position:absolute;left:50%;top:20%;width:86%;height:75%;transform:translateX(-50%) scaleY(.18);transform-origin:top center;clip-path:polygon(48% 0,52% 0,88% 100%,12% 100%);background:linear-gradient(180deg,rgba(255,246,207,.58),rgba(255,235,185,.2) 72%,transparent);opacity:0}
.love-light.play .love-light-beam{animation:beamReach 2.8s cubic-bezier(.2,.62,.35,1) forwards}
.love-light-couple{position:absolute;left:50%;top:78%;width:52%;height:24%;transform:translate(-50%,-50%) scale(.72);border-radius:50%;background:radial-gradient(ellipse,rgba(255,239,199,.56),rgba(255,226,165,.18) 42%,transparent 72%);opacity:0}
.love-light.play .love-light-couple{animation:coupleGlow 2.8s ease-out forwards}
@keyframes beamReach{0%{opacity:0;transform:translateX(-50%) scaleY(.16)}18%{opacity:.88}72%{opacity:.72;transform:translateX(-50%) scaleY(1)}100%{opacity:0;transform:translateX(-50%) scaleY(1)}}
@keyframes coupleGlow{0%,18%{opacity:0;transform:translate(-50%,-50%) scale(.72)}42%{opacity:.88;transform:translate(-50%,-50%) scale(1)}74%{opacity:.58}100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes lightWash{0%,100%{opacity:0}18%,72%{opacity:1}}
.bubble{position:absolute;transform:translate(-50%,-115%);background:var(--paper);color:var(--ink);padding:.7em 1em;border-radius:12px;font-size:13px;line-height:1.6;max-width:64vw;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.35);border:1px solid rgba(163,36,43,.35);animation:pop .3s ease}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--paper)}
@keyframes pop{from{transform:translate(-50%,-105%) scale(.7);opacity:0}to{transform:translate(-50%,-115%) scale(1);opacity:1}}
/* ---------- 照片浮层（厚涂画框） ---------- */
#lightbox{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(15,8,8,.72);backdrop-filter:blur(3px)}
#lightbox.show{display:flex}
.photo-card{width:min(78vw,360px);border-radius:8px;padding:12px;background:linear-gradient(160deg,#e9dcc3,#d9c5a0);box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 0 0 2px rgba(110,17,22,.25);animation:rise .35s ease}
@keyframes rise{from{transform:translateY(26px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.photo-frame{aspect-ratio:3/4;border-radius:4px;background:radial-gradient(circle at 35% 30%,#f3e2c2,#cbb28a 60%,#b39a72);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7a5b34;gap:.6em;box-shadow:inset 0 0 24px rgba(90,60,20,.35)}
.photo-frame .big{font-size:64px;color:var(--red);font-weight:700;text-shadow:1px 2px 0 rgba(0,0,0,.12)}
.photo-frame .cap{font-size:14px;letter-spacing:.25em}
.photo-card .name{text-align:center;margin-top:10px;font-size:15px;letter-spacing:.3em;color:#5d3f22}
.photo-card .sub{text-align:center;font-size:12px;color:#8a6a42;margin-top:4px;letter-spacing:.15em}
/* 右下角固定猫爪按钮已移除；上下滑动改由猫爪扫屏完成翻页。 */
/* ---------- 全屏开篇视频 ---------- */
#intro{background:#080606}
.opening-shell{position:absolute;inset:0}
.opening-frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,56.25vh);height:min(100vh,177.7778vw);width:min(100vw,56.25dvh);height:min(100dvh,177.7778vw);aspect-ratio:9/16;overflow:hidden;background:#080606}
.opening-frame video{display:block;width:100%;height:100%;object-fit:contain;background:#080606}
.opening-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;padding:0;border:1px solid #f0d39a;border-radius:50%;background:rgba(110,17,22,.94);color:#fff5e5;display:grid;place-items:center;box-shadow:0 4px 20px rgba(0,0,0,.6);cursor:pointer;z-index:3}
.opening-play svg{width:22px;height:22px;margin-left:2px;display:block}
.opening-play:focus-visible,.opening-button:focus-visible{outline:3px solid #ffe4a6;outline-offset:3px}
.opening-actions{position:absolute;inset:0;pointer-events:none}
.opening-button{pointer-events:auto;min-height:48px;padding:10px 16px;border:1px solid rgba(201,160,99,.82);border-radius:12px;background:rgba(38,20,20,.94);color:#fff3df;font:inherit;font-size:15px;letter-spacing:.1em;cursor:pointer;touch-action:manipulation}
#skipOpening{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;min-width:44px;min-height:44px;padding:9px 15px;border-radius:999px;background:rgba(20,12,12,.78);font-size:13px;white-space:nowrap}
.seal-open{position:absolute;left:50.3%;top:50.4%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border:0;border-radius:50%;padding:0;background:transparent;color:#fff5e5;cursor:pointer;z-index:2;touch-action:manipulation}
.seal-open:focus-visible{outline:3px solid #ffe4a6;outline-offset:5px}
.seal-ring{position:absolute;inset:0;border:2px solid rgba(255,236,190,.95);border-radius:50%;box-shadow:0 0 14px rgba(255,226,164,.75),inset 0 0 12px rgba(255,226,164,.28);animation:sealPulse 1.8s ease-out infinite}
.seal-ring:after{content:"";position:absolute;inset:12%;border:1px solid rgba(255,246,218,.86);border-radius:50%;animation:sealPulse 1.8s .45s ease-out infinite}
@keyframes sealPulse{0%{opacity:.95;transform:scale(.72)}75%,100%{opacity:0;transform:scale(1.48)}}
.seal-label{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);padding:.45em .9em;border:1px solid rgba(240,211,154,.7);border-radius:999px;background:rgba(28,16,16,.84);box-shadow:0 2px 12px rgba(0,0,0,.5);color:#fff4df;font-size:clamp(12px,3.5vw,15px);letter-spacing:.15em;white-space:nowrap}
[hidden]{display:none!important}
/* ---------- 角落固定轴心的挥手翻幕：新旧两幕沿挥动边界交替显露 ---------- */
#tr-cat-wipe{position:fixed;inset:0;z-index:850;display:none;overflow:hidden;pointer-events:none;isolation:isolate}
#tr-cat-wipe.play{display:block}
.wipe-scene-copy.scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden;contain:layout paint style}
.wipe-scene-copy *{animation-play-state:paused!important}
.wipe-intro-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#080606}
.cat-swipe-paw{position:absolute;z-index:2;display:none;width:120vw;max-width:none;height:auto;opacity:0;object-fit:contain;will-change:transform,opacity;pointer-events:none}
#tr-cat-wipe.wipe-next .cat-swipe-paw{left:100vw;bottom:-40vw;transform-origin:0 50%}
#tr-cat-wipe.wipe-prev .cat-swipe-paw{left:0;bottom:-40vw;transform-origin:0 50%}
#tr-cat-wipe.wipe-next .cat-swipe-paw.oreo,#tr-cat-wipe.wipe-prev .cat-swipe-paw.kulomi{display:block}
@media(prefers-reduced-motion:reduce){.wipe-scene-copy *{animation-duration:.01ms!important;animation-iteration-count:1!important}}
/* ---------- 流程时间轴弹层 ---------- */
.modal{position:fixed;inset:0;z-index:1100;display:none;align-items:flex-end;justify-content:center;background:rgba(12,6,6,.7)}
.modal.show{display:flex}
.modal .sheet{width:100%;max-width:480px;max-height:72vh;overflow:auto;background:linear-gradient(180deg,#f7efdd,#efe1c4);border-radius:18px 18px 0 0;padding:22px 22px 30px;animation:up .35s ease}
@keyframes up{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}
.modal h3{color:var(--red);letter-spacing:.3em;font-size:17px;text-align:center;margin-bottom:6px}
.modal .sub{text-align:center;font-size:12px;color:#8a6a42;letter-spacing:.2em;margin-bottom:16px}
.tl{list-style:none;position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(#c9a063,#a3242b)}
.tl li{position:relative;margin-bottom:14px;padding-left:14px;font-size:14px;line-height:1.65}
.tl li:before{content:"";position:absolute;left:-19px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(163,36,43,.18)}
.tl b{color:#6e1116}
.modal .close{margin-top:10px;width:100%;padding:12px;border:none;border-radius:10px;background:var(--red);color:#f6dcbd;font-size:15px;letter-spacing:.3em}
/* ---------- 地址/导航弹层 ---------- */
.addr{font-size:14px;line-height:2;letter-spacing:.06em;text-align:center;color:#42342a}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px 6px;border-radius:10px;border:1px solid rgba(163,36,43,.4);background:#fff8ea;color:#6e1116;font-size:14px;letter-spacing:.15em;text-decoration:none;text-align:center;cursor:pointer}
.btn.primary{background:var(--red);color:#f6dcbd;border:none}
/* ---------- 婚礼指南尾幕 ---------- */
#ending{position:relative;display:block;overflow:hidden;background:#2d211b}
#guideBgVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
#ending:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(42,28,20,.06),rgba(42,28,20,.10) 54%,rgba(23,15,13,.38))}
.guide-logo-shell{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);z-index:2;width:min(96vw,620px);aspect-ratio:1652/700;filter:drop-shadow(0 2px 8px rgba(51,31,19,.22))}
.guide-logo-shell img{display:block;width:100%;height:100%;object-fit:contain}
.guide-open{position:absolute;left:50%;top:69%;transform:translate(-50%,-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 14px;border:0;background:transparent;color:#fff8e8;font:inherit;cursor:pointer;touch-action:manipulation;text-shadow:0 2px 10px rgba(34,18,12,.85)}
.guide-open:active{transform:translate(-50%,-50%) scale(.97)}
.guide-ring{position:relative;display:block;width:58px;height:58px;border:1px solid rgba(255,244,220,.95);border-radius:50%;box-shadow:0 0 12px rgba(255,232,190,.58),inset 0 0 8px rgba(255,246,220,.25)}
.guide-ring:before,.guide-ring:after{content:"";position:absolute;inset:-1px;border:1px solid rgba(255,243,218,.94);border-radius:50%;opacity:0;animation:guidePulse 2.8s ease-out infinite}
.guide-ring:after{animation-delay:1.4s}
@keyframes guidePulse{0%{opacity:0;transform:scale(.56)}18%{opacity:.88}75%{opacity:.45;transform:scale(1.35)}100%{opacity:0;transform:scale(1.62)}}
.guide-label{font-size:clamp(14px,4vw,16px);letter-spacing:.14em;white-space:nowrap}
#days{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2;color:#fff3df;font-size:12px;letter-spacing:.18em;white-space:nowrap;text-shadow:0 2px 9px rgba(30,17,12,.9)}
#days b{color:#ffe4aa!important}
/* 纸屑 */
.confetti{position:fixed;top:-12px;z-index:1600;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(540deg);opacity:.85}}
/* 手印涟漪 */
.ripple{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid rgba(179,38,44,.85);transform:translate(-50%,-50%);animation:rip .9s ease-out forwards;pointer-events:none}
@keyframes rip{to{width:120px;height:120px;opacity:0}}
@media (max-width:380px){.chapter-tag{font-size:12px}}
</style>

<audio id="inviteMusic" src="./assets/web/invite-bgm.m4a" autoplay loop preload="auto" aria-hidden="true"></audio>

<div id="deck">

  <!-- ═══════ 开篇视频 ═══════ -->
  <section class="scene" id="intro">
    <div class="opening-shell">
      <div class="opening-frame">
        <video id="openingVideo" src="./assets/web/opening-video-mobile-performance-test.mp4" autoplay muted playsinline webkit-playsinline preload="auto" poster="./assets/web/opening-video-poster.jpg" aria-label="婚礼请柬开篇视频"></video>
        <button class="seal-open" id="sealOpen" type="button" aria-label="点击打开婚礼请柬" hidden><span class="seal-ring" aria-hidden="true"></span><span class="seal-label">点击打开</span></button>
      </div>
    </div>
  </section>

  <!-- ═══════ 第一幕 · 相遇 ═══════ -->
  <section class="scene" id="act1">
    <img class="bg" data-src="./assets/web/act1.jpg" alt="第一幕 · 相遇" loading="lazy" decoding="async">
    <div class="vignette"></div>
    <div class="chapter-tag">壹 · 相遇</div>
    <div class="hot" data-act="lamp-petals" data-art-x="0.509" data-art-y="0.180" data-ring-ratio="0.047" style="left:50.9%;top:18%;width:15vw;height:10vh;--ring-size:clamp(16px,5.7vw,28px)" aria-label="点击吊灯，落下花瓣"><span class="ring"></span></div>
    <div class="hot" data-act="meet-story" data-art-x="0.383" data-art-y="0.550" data-ring-ratio="0.047" style="left:38.3%;top:55%;width:20vw;height:15vh;--ring-size:clamp(16px,5.7vw,28px)" aria-label="点击精灵，查看相遇故事"><span class="ring"></span></div>
    <div class="hot" data-act="photo-person" data-art-x="0.717" data-art-y="0.689" data-ring-ratio="0.047" style="left:71.7%;top:68.9%;width:22vw;height:23vh;--ring-size:clamp(16px,5.7vw,28px)" aria-label="点击新人，查看婚纱照"><span class="ring"></span></div>
  </section>

  <!-- ═══════ 第二幕 · 相知 ═══════ -->
  <section class="scene" id="act2">
    <img class="bg" data-src="./assets/web/act2.jpg" alt="第二幕 · 相知" loading="lazy" decoding="async">
    <div class="vignette"></div>
    <div class="chapter-tag">贰 · 相知</div>

<script>
/* ================= 基础 ================= */
var deck=document.getElementById('deck');
var scenes=[].slice.call(document.querySelectorAll('.scene'));
var guideBgVideo=document.getElementById('guideBgVideo');
var inviteMusic=document.getElementById('inviteMusic');
function tryStartInviteMusic(){if(!inviteMusic)return;var result=inviteMusic.play();if(result&&result.catch)result.catch(function(){});}
function syncGuideBackground(n){if(!guideBgVideo)return;if(n===scenes.length-1){if(!guideBgVideo.getAttribute('src')){guideBgVideo.src=guideBgVideo.getAttribute('data-src');guideBgVideo.load();}var playResult=guideBgVideo.play();if(playResult&&playResult.catch)playResult.catch(function(){});}else if(!guideBgVideo.paused)guideBgVideo.pause();}
function cur(){var h=deck.clientHeight||innerHeight;var i=Math.round(deck.scrollTop/h);return Math.min(scenes.length-1,Math.max(0,i));}
function go(i){var n=Math.max(0,Math.min(scenes.length-1,i));deck.scrollTop=scenes[n].offsetTop;scenes.forEach(function(scene,index){scene.classList.toggle('is-current',index===n);});syncGuideBackground(n);}

var toastTimer;
function toast(msg,ms){var t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},ms||2600);}

/* ================= 开篇视频：纯画面静音自动播放；失败时轻触画面重试 ================= */
var openingVideo=document.getElementById('openingVideo');
var openingFrame=document.querySelector('.opening-frame');
var sealOpen=document.getElementById('sealOpen');
function enterInvite(){playCatWipe(1,function(){openingVideo.pause();go(1);});}
function playOpeningVideo(){
  if(openingVideo.ended)return;
  openingVideo.muted=true;
  var result=openingVideo.play();
  if(result&&result.catch)result.catch(function(){});
}
function retryAutoplay(){if(openingVideo.paused&&!openingVideo.ended)playOpeningVideo();}
openingFrame.addEventListener('click',function(){if(openingVideo.paused&&!openingVideo.ended)playOpeningVideo();});
sealOpen.addEventListener('click',function(e){e.stopPropagation();enterInvite();});
openingVideo.addEventListener('ended',function(){sealOpen.hidden=false;warmScene(1);loadPawArtwork(true);});
openingVideo.addEventListener('loadeddata',retryAutoplay);
document.addEventListener('WeixinJSBridgeReady',retryAutoplay,false);
window.addEventListener('pageshow',retryAutoplay,false);
if(window.WeixinJSBridge)window.setTimeout(retryAutoplay,0);
playOpeningVideo();

/* ================= 照片浮层 ================= */
var lightbox=document.getElementById('lightbox'),card=document.getElementById('photoCard');
var PHOTO={ /* 占位照片数据：臻诚提供原图后替换 */
 person:{icon:'婚',name:'我们的婚纱照',sub:'照片待替换'},
 catK:{icon:'猫',name:'库洛米 · 本尊',sub:'真实照片待替换'},
 catA:{icon:'猫',name:'奥利奥 · 本尊',sub:'真实照片待替换'},
 landCQ:{icon:'渝',name:'重庆 · 我们来过',sub:'旅行照片待替换'},
 landXY:{icon:'宁',name:'高原 · 我们来过',sub:'旅行照片待替换'}
};
function showPhoto(k){var p=PHOTO[k];if(!p)return;card.innerHTML='<div class="photo-frame"><span class="big">'+p.icon+'</span><span class="cap">'+p.name+'</span></div><div class="name">'+p.name+'</div><div class="sub">'+p.sub+'</div>';lightbox.classList.add('show');}
lightbox.addEventListener('click',function(){lightbox.classList.remove('show')});

/* ================= 角落固定轴心的挥手翻幕 ================= */
var catWipe=document.getElementById('tr-cat-wipe'),catWipeBusy=false,pawArtworkPromises={};
var sceneWarmPromises={},swipeStart=null,ignoreTapUntil=0,wheelDelta=0,wheelTimer=0;
function loadPawArtwork(forward){
  var img=catWipe.querySelector(forward?'.cat-swipe-paw.oreo':'.cat-swipe-paw.kulomi');
  var key=forward?'oreo':'kulomi';
  if(!pawArtworkPromises[key]){
    pawArtworkPromises[key]=new Promise(function(resolve){
      if(img.complete&&img.naturalWidth){resolve();return;}
      img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});img.src=img.getAttribute('data-src');
    }).then(function(){return img.decode?img.decode().catch(function(){}):Promise.resolve();});
  }
  return pawArtworkPromises[key];
}
function warmScene(index){
  if(index<0||index>=scenes.length)return Promise.resolve();
  if(sceneWarmPromises[index])return sceneWarmPromises[index];
  var img=scenes[index].querySelector('.bg');
  if(!img)return Promise.resolve();
  img.loading='eager';
  if(!img.getAttribute('src')){var deferredSrc=img.getAttribute('data-src');if(deferredSrc)img.src=deferredSrc;}
  sceneWarmPromises[index]=new Promise(function(resolve){
    var settled=false,timer;
    function finish(){if(settled)return;settled=true;clearTimeout(timer);img.removeEventListener('load',finish);img.removeEventListener('error',finish);resolve();}
    if(img.complete){finish();return;}
    img.addEventListener('load',finish,{once:true});img.addEventListener('error',finish,{once:true});timer=setTimeout(finish,2500);
  }).then(function(){return img.decode?img.decode().catch(function(){}):Promise.resolve();}).then(function(){positionArtHotspots(index);});
  return sceneWarmPromises[index];
}
function positionArtHotspots(index){
  if(index<=0||index>=scenes.length)return;
  var scene=scenes[index],img=scene.querySelector('.bg');if(!img||!img.naturalWidth)return;
  var sw=scene.clientWidth,sh=scene.clientHeight,scale=Math.max(sw/img.naturalWidth,sh/img.naturalHeight),rw=img.naturalWidth*scale,rh=img.naturalHeight*scale,ox=(sw-rw)/2,oy=(sh-rh)/2;
  scene.querySelectorAll('[data-art-x][data-art-y]').forEach(function(h){var x=Number(h.getAttribute('data-art-x')),y=Number(h.getAttribute('data-art-y'));h.style.left=((x*rw+ox)/sw*100)+'%';h.style.top=((y*rh+oy)/sh*100)+'%';var ratio=Number(h.getAttribute('data-ring-ratio'));if(ratio>0)h.style.setProperty('--ring-size',Math.max(16,Math.min(36,rw*ratio))+'px');});
}
function positionAllArtHotspots(){for(var i=1;i<scenes.length;i++)positionArtHotspots(i);}
window.addEventListener('resize',positionAllArtHotspots);
function warmAround(index){warmScene(index-1);warmScene(index+1);}
function incomingScene(index){
  var copy=scenes[index].cloneNode(true);copy.classList.add('wipe-scene-copy');
  [].slice.call(copy.querySelectorAll('.hot')).forEach(function(hot){hot.remove();});
  var images=[].slice.call(copy.querySelectorAll('img'));
  images.forEach(function(img){img.loading='eager';});
  var video=copy.querySelector('video');
  if(video){var posterUrl=video.getAttribute('poster'),frame=copy.querySelector('.opening-frame');video.remove();if(frame&&posterUrl){var poster=document.createElement('img');poster.className='wipe-intro-poster';poster.src=posterUrl;poster.alt='';frame.appendChild(poster);}}
  var seal=copy.querySelector('#sealOpen');if(seal)seal.hidden=true;
  return copy;
}
function sceneImagesReady(copy){
  var images=[].slice.call(copy.querySelectorAll('img'));
  return Promise.all(images.map(function(img){return new Promise(function(resolve){
    if(img.complete&&img.naturalWidth){resolve();return;}
    var done=function(){img.removeEventListener('load',done);img.removeEventListener('error',done);resolve();};
    img.addEventListener('load',done);img.addEventListener('error',done);window.setTimeout(done,1800);
  });})).then(function(){return Promise.all(images.map(function(img){return img.decode?img.decode().catch(function(){}):Promise.resolve();}));});
}
function setWipeProgress(copy,progress,forward,width,height){
  var angle=Math.max(-65,92-175*progress),top,clip,release=Math.max(0,Math.min(1,(progress-.9)/.1));
  if(angle>=0){clip=forward?'polygon(0% 100%,0% 100%,0% 100%)':'polygon(100% 100%,100% 100%,100% 100%)';}
  else{
    var slope=Math.tan(-angle*Math.PI/180),edgeY=100*(height-width*slope)/height;
    if(progress>.9){top=forward?100*release:100*(1-release);clip=forward?'polygon(0% 0%,'+top+'% 0%,100% 100%,0% 100%)':'polygon(100% 0%,'+top+'% 0%,0% 100%,100% 100%)';}
    else if(edgeY>=0){clip=forward?'polygon(0% '+edgeY+'%,100% 100%,0% 100%)':'polygon(100% '+edgeY+'%,100% 100%,0% 100%)';}
    else{top=forward?100*(width-height/slope)/width:100*(height/slope)/width;top=Math.max(0,Math.min(100,top));clip=forward?'polygon(0% 0%,'+top+'% 0%,100% 100%,0% 100%)':'polygon(100% 0%,'+top+'% 0%,0% 100%,100% 100%)';}
  }
  copy.style.clipPath=clip;copy.style.webkitClipPath=clip;
}
function playCatWipe(target,fn){
  if(catWipeBusy)return;
  var current=cur(),forward=target>current,copy;
  catWipeBusy=true;catWipe.classList.remove('wipe-next','wipe-prev');catWipe.classList.add('play',forward?'wipe-next':'wipe-prev');
  var paws=[].slice.call(catWipe.querySelectorAll('.cat-swipe-paw'));
  paws.forEach(function(paw){paw.style.display=((forward&&paw.classList.contains('oreo'))||(!forward&&paw.classList.contains('kulomi')))?'block':'none';paw.style.opacity='0';});
  var wipeWidth=window.innerWidth,wipeHeight=window.innerHeight;
  var paw=forward?catWipe.querySelector('.cat-swipe-paw.oreo'):catWipe.querySelector('.cat-swipe-paw.kulomi');
  Promise.all([loadPawArtwork(forward),warmScene(target)]).then(function(){
    copy=incomingScene(target);setWipeProgress(copy,0,forward,wipeWidth,wipeHeight);catWipe.appendChild(copy);
    return target===0?sceneImagesReady(copy):Promise.resolve();
  }).then(function(){
    var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var duration=reduced?420:1200,startTime=0;
    function frame(now){
      if(!startTime)startTime=now;
      var raw=Math.min(1,(now-startTime)/duration),p=raw*raw*(3-2*raw);
      setWipeProgress(copy,p,forward,wipeWidth,wipeHeight);
      var angle=Math.max(-65,92-175*p),opacity=Math.max(0,Math.min(1,p/.1,(1-p)/.08)),scale=.9+.1*Math.sin(Math.PI*p);
      if(paw){paw.style.opacity=String(opacity);paw.style.transform=(forward?'scaleX(-1) ':'')+'rotate('+angle+'deg) scale('+scale+')';}
      if(raw<1){window.requestAnimationFrame(frame);return;}
      if(fn)fn();
      warmAround(target);
      window.requestAnimationFrame(function(){copy.remove();catWipe.classList.remove('play','wipe-next','wipe-prev');catWipeBusy=false;});
    }
    window.requestAnimationFrame(frame);
  });
}
function stepScene(direction){
  if(catWipeBusy)return;
  var current=cur();
  if(current===0&&!openingVideo.ended)return;
  var next=current+direction;if(next<0||next>=scenes.length)return;
  ignoreTapUntil=Date.now()+700;
  playCatWipe(next,function(){if(cur()===0&&next>0)openingVideo.pause();go(next);});
}
deck.addEventListener('touchstart',function(e){
  if(e.touches.length!==1)return;
  var t=e.touches[0];swipeStart={x:t.clientX,y:t.clientY};
},{passive:true});
deck.addEventListener('touchend',function(e){
  if(!swipeStart||!e.changedTouches.length)return;
  var t=e.changedTouches[0],dx=t.clientX-swipeStart.x,dy=t.clientY-swipeStart.y;swipeStart=null;
  if(Math.abs(dy)<58||Math.abs(dy)<Math.abs(dx)*1.18)return;
  stepScene(dy<0?1:-1);
},{passive:true});
deck.addEventListener('touchcancel',function(){swipeStart=null;},{passive:true});
deck.addEventListener('wheel',function(e){
  e.preventDefault();if(catWipeBusy)return;
  wheelDelta+=e.deltaY;window.clearTimeout(wheelTimer);wheelTimer=window.setTimeout(function(){wheelDelta=0;},180);
  if(Math.abs(wheelDelta)>=48){var direction=wheelDelta>0?1:-1;wheelDelta=0;stepScene(direction);}
},{passive:false});
document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey||(e.target.closest&&e.target.closest('input,textarea,select,button,a')))return;
  var direction=(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' ')?1:(e.key==='ArrowUp'||e.key==='PageUp'?-1:0);
  if(direction){e.preventDefault();stepScene(direction);}
});
/* ================= 纸屑 ================= */
function confetti(n){for(var i=0;i<n;i++){var c=document.createElement('div');c.className='confetti';var size=6+Math.random()*8;c.style.width=size+'px';c.style.height=size*1.4+'px';c.style.left=Math.random()*100+'vw';c.style.background=['#a3242b','#c9a063','#e8b96a','#f0e2c8','#7c9e6b'][i%5];c.style.animationDuration=(2.2+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(c);setTimeout(function(){c.remove()},5000);}}

/* ================= 交互分发 ================= */
document.getElementById('deck').addEventListener('click',function(e){
  var h=e.target.closest('.hot');
  if(h&&h.getAttribute('data-act')==='cloud-tour'){e.preventDefault();window.location.assign(h.href);return;}
  if(Date.now()<ignoreTapUntil){e.preventDefault();return;}
  if(!h)return;
  var a=h.getAttribute('data-act');
  switch(a){
    case 'lamp-petals': fallingPetalsFull(h.closest('.scene'),42);break;
    case 'meet-story': showStory('从游戏里的一次相遇开始','相遇 · 故事');break;
    case 'photo-person': showPhoto('person');break;
    case 'photo-cat-kuluomi': showPhoto('catK');break;
    case 'photo-cat-aoliao': showPhoto('catA');break;
    case 'photo-land-chongqing': showPhoto('landCQ');break;
    case 'photo-land-plateau': showPhoto('landXY');break;
    case 'handprint': ripple(h);toast('2025.10.16，我们订婚啦 ❤');break;
    case 'couple-light': castCoupleLight();break;
    case 'full-petals': fallingPetalsFull(h.closest('.scene'),42);break;
    case 'marriage-story': showStory('国徽下的承诺','领证 · 故事');break;
    case 'door': document.getElementById('addrModal').classList.add('show');break;
    case 'addr': copyAddr();break;
    case 'stage': document.getElementById('tlModal').classList.add('show');break;
    case 'petal': confetti(60);toast('花瓣落满堂 🌸');break;
  }
});
var storyModal=document.getElementById('storyModal');
function showStory(kicker,title){document.getElementById('storyKicker').textContent=kicker;document.getElementById('storyTitle').textContent=title;document.getElementById('storyText').textContent='故事内容待补充';storyModal.classList.add('show');}
storyModal.addEventListener('click',function(e){if(e.target===storyModal||e.target.id==='storyClose')storyModal.classList.remove('show');});
function newPetal(scene,left,top){
  var p=document.createElement('span');p.className='falling-petal';p.style.left=left+'%';p.style.top=top+'%';
  p.style.setProperty('--petal-w',(11+Math.random()*9)+'px');p.style.setProperty('--petal-h',(17+Math.random()*13)+'px');p.style.setProperty('--petal-drift',((-18+Math.random()*36).toFixed(1))+'vw');p.style.setProperty('--petal-turn',(260+Math.random()*520).toFixed(0)+'deg');p.style.setProperty('--petal-time',(4.4+Math.random()*1.7).toFixed(2)+'s');p.style.setProperty('--petal-delay',(Math.random()*.75).toFixed(2)+'s');scene.appendChild(p);window.setTimeout(function(petal){return function(){petal.remove();};}(p),7800);
}
function fallingPetalsFull(scene,count){for(var i=0;i<count;i++)newPetal(scene,Math.random()*100,-7+Math.random()*12);}
var loveLightTimer=0;
function castCoupleLight(){var light=document.getElementById('loveLight');light.classList.remove('play');void light.offsetWidth;light.classList.add('play');window.clearTimeout(loveLightTimer);loveLightTimer=window.setTimeout(function(){light.classList.remove('play');},3000);}
function ripple(h){var scene=h.closest('.scene');var r=document.createElement('div');r.className='ripple';r.style.left=h.style.left;r.style.top=h.style.top;scene.appendChild(r);setTimeout(function(){r.remove()},950);}
function copyAddr(){var addr='重庆市两江新区腾芳大道8号 禧满鸿福酒店';if(navigator.clipboard){navigator.clipboard.writeText(addr).then(function(){toast('地址已复制 ✂')},function(){toast(addr)});}else{toast(addr);}}
document.getElementById('copyBtn').onclick=copyAddr;

/* ================= 背景音乐：尝试自动播放，受设备策略拦截时在首次交互后重试 ================= */
document.addEventListener('WeixinJSBridgeReady',tryStartInviteMusic,false);
window.addEventListener('pageshow',tryStartInviteMusic,false);
document.addEventListener('touchstart',tryStartInviteMusic,{once:true,passive:true});
document.addEventListener('click',tryStartInviteMusic,{once:true});
if(window.WeixinJSBridge)window.setTimeout(tryStartInviteMusic,0);
tryStartInviteMusic();

document.getElementById('openGuide').addEventListener('click',function(){document.getElementById('guideModal').classList.add('show');});
(function(){var target=new Date('2026-10-25T00:00:00+08:00');var d=Math.ceil((target-new Date())/86400000);var el=document.getElementById('days');el.innerHTML=d>0?('距 离 2 0 2 6 . 1 0 . 2 5 · 还 有 <b style="color:#e8b96a;font-size:18px">'+d+'</b> 天'):(d===0?'今天，是我们的大喜日子 🎊':'新婚快乐，岁岁常相见');})();
