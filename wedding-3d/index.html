:root{--gold:#e6c47d;--gold2:#f4e2b8;--ink:#f3f6fb;--dim:rgba(243,246,251,.60)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05070f;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.hand{font-family:"WeddingHand","STXingkai","Kaiti SC",serif}
canvas{display:block;position:fixed;inset:0}

/* 顶部标题 */
#hud{position:fixed;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 20px 0;
  text-align:center;pointer-events:none;z-index:5;transition:opacity 1s}
#hud h1{margin:0;font-size:22px;font-weight:400;letter-spacing:.10em;color:#fff;
  text-shadow:0 2px 18px rgba(140,185,255,.45)}
#hud .sub{margin-top:5px;font-size:11px;letter-spacing:.30em;color:var(--gold);opacity:.85}

/* 底部进度与提示 */
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom));
  width:74%;max-width:420px;z-index:5;pointer-events:none}
#bar .track{height:2px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
#bar .track>i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(244,226,184,.9),var(--gold));transition:width .2s linear}
#hint{margin-top:12px;text-align:center;font-size:12px;color:var(--dim);letter-spacing:.08em;
  transition:opacity .8s}

/* 开场加载 */
#boot{position:fixed;inset:0;z-index:20;background:#05070f;display:flex;flex-direction:column;
  align-items:center;justify-content:center;transition:opacity .9s}
#boot .t{font-size:26px;letter-spacing:.12em;color:#fff}
#boot .s{margin-top:14px;font-size:12px;color:var(--dim);letter-spacing:.12em}
#boot .p{margin-top:26px;width:150px;height:2px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
#boot .p>i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}

/* 打开单张 */
#view{position:fixed;inset:0;z-index:30;background:rgba(4,6,12,.94);display:none;
  align-items:center;justify-content:center;flex-direction:column;padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
#view.on{display:flex}
#view img{max-width:100%;max-height:76%;object-fit:contain;border-radius:6px;
  box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 0 1px rgba(230,196,125,.30);
  transform:scale(.94);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.3,1),opacity .35s}
#view.on img{transform:scale(1);opacity:1}
#view .cap{margin-top:22px;font-size:19px;letter-spacing:.14em;color:var(--gold2);min-height:1.2em}
#view .tip{margin-top:10px;font-size:11px;color:var(--dim);letter-spacing:.10em}

/* 结尾：汇成合影 */
#end{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 20%,#12294a 0%,#080e1c 55%,#05070f 100%);padding:calc(26px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom));overflow-y:auto}
#end.on{display:flex}
#end .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;width:100%;max-width:520px}
#end .grid img{width:calc((100% - 20px)/6);aspect-ratio:1/1;object-fit:cover;border-radius:3px;opacity:0;
  animation:pop .5s ease forwards}
@keyframes pop{to{opacity:1}}
#end h2{margin:22px 0 0;font-size:30px;font-weight:400;letter-spacing:.14em;color:#fff;text-align:center}
#end .sub{margin-top:10px;font-size:12px;letter-spacing:.28em;color:var(--gold)}
#end button{margin-top:24px;border:1px solid rgba(230,196,125,.45);background:transparent;color:var(--gold2);
  padding:12px 26px;border-radius:999px;font-size:14px;letter-spacing:.10em}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
  padding:30px;font-size:14px;line-height:2;color:var(--dim);z-index:40;background:#05070f}
</style>
</head>
<body>

<div id="hud">
  <h1 class="hand">汪仕诚 &amp; 马晗瑜</h1>
  <div class="sub">2026 · 10 · 25</div>
</div>

<div id="bar">
  <div class="track"><i id="prog"></i></div>
  <div id="hint">左右拖动看看 · 点照片打开回忆</div>
</div>

<div id="boot">
  <div class="t hand">走进去看</div>
  <div class="s">正在布置相册…</div>
  <div class="p"><i id="bootbar"></i></div>
</div>

<div id="view"><img alt=""><div class="cap hand"></div><div class="tip">点任意位置继续</div></div>

<div id="end">
  <div class="grid" id="endgrid"></div>
  <h2 class="hand">光的尽头 是我们</h2>
  <div class="sub">2026.10.25</div>
  <button id="again">重新走一次</button>
</div>

<div id="err">这台设备的浏览器不太支持 3D 画面<br>换微信里打开，或者用手机自带浏览器试试</div>

<script src="three.min.js"></script>
<script>
(function () {
  'use strict';
  const PHOTOS = [{"src":"photos/01.jpg","w":675,"h":900,"cap":"订婚那天"},{"src":"photos/02.jpg","w":675,"h":900,"cap":""},{"src":"photos/03.jpg","w":675,"h":900,"cap":""},{"src":"photos/04.jpg","w":900,"h":675,"cap":""},{"src":"photos/05.jpg","w":900,"h":900,"cap":"领证"},{"src":"photos/06.jpg","w":900,"h":900,"cap":""},{"src":"photos/07.jpg","w":675,"h":900,"cap":""},{"src":"photos/08.jpg","w":675,"h":900,"cap":""},{"src":"photos/09.jpg","w":604,"h":900,"cap":"婚纱照"},{"src":"photos/10.jpg","w":604,"h":900,"cap":""},{"src":"photos/11.jpg","w":604,"h":900,"cap":""},{"src":"photos/12.jpg","w":604,"h":900,"cap":""},{"src":"photos/13.jpg","w":604,"h":900,"cap":""},{"src":"photos/14.jpg","w":604,"h":900,"cap":""},{"src":"photos/15.jpg","w":604,"h":900,"cap":""},{"src":"photos/16.jpg","w":604,"h":900,"cap":""},{"src":"photos/17.jpg","w":604,"h":900,"cap":""},{"src":"photos/18.jpg","w":604,"h":900,"cap":""},{"src":"photos/19.jpg","w":604,"h":900,"cap":""},{"src":"photos/20.jpg","w":604,"h":900,"cap":""},{"src":"photos/21.jpg","w":900,"h":876,"cap":"奥利奥"},{"src":"photos/22.jpg","w":900,"h":675,"cap":"库洛米"}];
  const CFG = {
    wallX: 1.95,        // 两侧墙的距离
    photoH: 1.92,       // 照片高度（场景单位）
    spacing: 3.40,      // 每站间距
    speed: 1.24,        // 自动前进速度
    lookAhead: 3.2,
    fogNear: 5.0,
    fogFar: 33
  };

  const canvasOK = (function () {
    try {
      const c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
    } catch (e) { return false; }
  })();
  if (!canvasOK || !window.THREE) { document.getElementById('err').style.display = 'flex'; document.getElementById('boot').style.display = 'none'; return; }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070f);
  scene.fog = new THREE.Fog(0x05070f, CFG.fogNear, CFG.fogFar);

  const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 200);
  // 竖屏时视野开大一点，不然两侧的照片会滑出画面
  camera.fov = (innerWidth / innerHeight) < 0.95 ? 72 : 57;
  camera.position.set(0, 1.62, 3.4);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.fov = camera.aspect < 0.95 ? 72 : 57;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ── 地面与顶面 ─────────────────────────────
  const floorMat = new THREE.MeshBasicMaterial({ color: 0x0a1222, transparent: true, opacity: 0.90 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 200), floorMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // 地面上的一层柔光，制造反光感
  const glowTex = makeRadialTexture([[0, 'rgba(120,170,235,0.28)'], [0.55, 'rgba(120,170,235,0.07)'], [1, 'rgba(120,170,235,0)']]);
  const sprawl = new THREE.Mesh(new THREE.PlaneGeometry(18, 90),
    new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  sprawl.rotation.x = -Math.PI / 2;
  sprawl.position.set(0, 0.01, -30);
  scene.add(sprawl);

  function makeRadialTexture(stops) {
    const s = 256, c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    stops.forEach(function (p) { grd.addColorStop(p[0], p[1]); });
    g.fillStyle = grd; g.fillRect(0, 0, s, s);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  // 两侧的墙（暗色渐变，让照片不是浮在空中）
  const wallTex = (function () {
    const c = document.createElement('canvas');
    c.width = 8; c.height = 256;
    const g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 0, 256);
    grd.addColorStop(0, '#04070f');
    grd.addColorStop(0.42, '#0d1930');
    grd.addColorStop(0.72, '#0a1526');
    grd.addColorStop(1, '#04070f');
    g.fillStyle = grd; g.fillRect(0, 0, 8, 256);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();
  const wallGeo = new THREE.PlaneGeometry(150, 7.2);
  const wallMat = new THREE.MeshBasicMaterial({ map: wallTex });
  const wallL = new THREE.Mesh(wallGeo, wallMat);
  wallL.position.set(-2.62, 3.0, -42);
  wallL.rotation.y = Math.PI / 2;
  scene.add(wallL);
  const wallR = new THREE.Mesh(wallGeo, wallMat);
  wallR.position.set(2.62, 3.0, -42);
  wallR.rotation.y = -Math.PI / 2;
  scene.add(wallR);

  // ── 金色边框纹理 ───────────────────────────
  const frameTex = (function () {
    const w = 256, h = 256, c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.clearRect(0, 0, w, h);
    g.strokeStyle = 'rgba(230,196,125,0.85)';
    g.lineWidth = 4;
    const r = 10, i = 14;
    g.beginPath();
    g.moveTo(i + r, i);
    g.arcTo(w - i, i, w - i, h - i, r);
    g.arcTo(w - i, h - i, i, h - i, r);
    g.arcTo(i, h - i, i, i, r);
    g.arcTo(i, i, w - i, i, r);
    g.closePath();
    g.stroke();
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();

  // ── 光点 ───────────────────────────────────
  const DUST = 260;
  const dustGeo = new THREE.BufferGeometry();
  const dpos = new Float32Array(DUST * 3), dseed = new Float32Array(DUST);
  for (let i = 0; i < DUST; i++) {
    dpos[i * 3] = (Math.random() - 0.5) * 11;
    dpos[i * 3 + 1] = Math.random() * 3.2 + 0.15;
    dpos[i * 3 + 2] = -Math.random() * 62 + 8;
    dseed[i] = Math.random() * Math.PI * 2;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
  const dustMat = new THREE.PointsMaterial({
    size: 0.055, map: glowTex, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false, color: 0xf6e6c0
  });
  const dust = new THREE.Points(dustGeo, dustMat);
  scene.add(dust);

  // ── 照片 ───────────────────────────────────
  const loader = new THREE.TextureLoader();
  const pickables = [];
  let loaded = 0;

  const total = PHOTOS.length;
  const stations = Math.ceil(total / 2);

  PHOTOS.forEach(function (p, i) {
    const station = Math.floor(i / 2);
    const side = (i % 2 === 0) ? -1 : 1;
    const z = -4 - station * CFG.spacing;
    const h = CFG.photoH * (station % 3 === 1 ? 0.86 : 1);
    const w = h * (p.w / p.h);
    const cx = side * CFG.wallX;
    const cy = 1.55 + (station % 2 ? 0.16 : -0.10);

    loader.load(p.src, function (tex) {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

      const geo = new THREE.PlaneGeometry(w, h);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: false });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(cx, cy, z);
      mesh.rotation.y = (side === -1 ? Math.PI / 2 : -Math.PI / 2) - side * 0.14;
      mesh.userData = { idx: i, cap: p.cap || '' };
      scene.add(mesh);
      pickables.push(mesh);

      // 金边框
      const fr = new THREE.Mesh(new THREE.PlaneGeometry(w + 0.14, h + 0.14),
        new THREE.MeshBasicMaterial({ map: frameTex, transparent: true, depthWrite: false, opacity: 0.9 }));
      fr.position.copy(mesh.position);
      fr.rotation.copy(mesh.rotation);
      fr.translateZ(-0.012);
      scene.add(fr);

      // 柔光
      const gl = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.75, h * 1.75),
        new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending,
          depthWrite: false, opacity: 0.42, color: 0x9ec6ff }));
      gl.position.copy(mesh.position);
      gl.rotation.copy(mesh.rotation);
      gl.translateZ(-0.03);
      scene.add(gl);

      // 地面倒影
      const rf = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.10, depthWrite: false }));
      rf.position.set(cx, -cy, z);
      rf.rotation.y = mesh.rotation.y;
      rf.scale.y = -1;
      scene.add(rf);

      loaded++;
      const pct = Math.round(loaded / total * 100);
      document.getElementById('bootbar').style.width = pct + '%';
      if (loaded === total) start();
    }, undefined, function () {
      loaded++;
      if (loaded === total) start();
    });
  });

  // ── 交互 ───────────────────────────────────
  let yaw = 0, pitch = 0, yawT = 0, pitchT = 0;
  let dragging = false, moved = 0, lastX = 0, lastY = 0, downT = 0;
  let running = false, done = false, t0 = 0, zStart = camera.position.z;
  const zEnd = -4 - (stations - 1) * CFG.spacing - 2.2;

  const el = renderer.domElement;
  el.addEventListener('pointerdown', function (e) {
    dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; downT = performance.now();
  });
  el.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    yawT += dx * 0.0026;
    pitchT = Math.max(-0.5, Math.min(0.5, pitchT + dy * 0.0018));
  });
  el.addEventListener('pointerup', function (e) {
    if (!dragging) return;
    dragging = false;
    if (moved < 9 && performance.now() - downT < 450) tapAt(e.clientX, e.clientY);
  });
  el.addEventListener('pointercancel', function () { dragging = false; });

  const ray = new THREE.Raycaster();
  function tapAt(x, y) {
    const r = el.getBoundingClientRect();
    const nd = { x: ((x - r.left) / r.width) * 2 - 1, y: -((y - r.top) / r.height) * 2 + 1 };
    ray.setFromCamera(nd, camera);
    const hit = ray.intersectObjects(pickables, false)[0];
    if (hit) openPhoto(hit.object.userData);
  }

  const view = document.getElementById('view');
  function openPhoto(d) {
    const img = view.querySelector('img');
    img.src = PHOTOS[d.idx].src;
    view.querySelector('.cap').textContent = d.cap || '';
    view.classList.add('on');
  }
  view.addEventListener('click', function () { view.classList.remove('on'); });

  // ── 结尾 ───────────────────────────────────
  const endEl = document.getElementById('end');
  document.getElementById('again').addEventListener('click', function () {
    endEl.classList.remove('on');
    camera.position.z = zStart; done = false; t0 = performance.now();
    document.getElementById('hud').style.opacity = 1;
  });

  function showEnd() {
    if (done) return;
    done = true; running = false;
    const g = document.getElementById('endgrid');
    g.innerHTML = '';
    PHOTOS.forEach(function (p, i) {
      const im = document.createElement('img');
      im.src = p.src;
      im.style.animationDelay = (i * 40) + 'ms';
      g.appendChild(im);
    });
    endEl.classList.add('on');
    document.getElementById('hud').style.opacity = 0;
  }

  // ── 主循环 ─────────────────────────────────
  let hintHidden = false;
  function start() {
    const boot = document.getElementById('boot');
    boot.style.opacity = 0;
    setTimeout(function () { boot.style.display = 'none'; }, 900);
    running = true; t0 = performance.now();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - (frame._last || now)) / 1000);
    frame._last = now;

    if (running) {
      const before = camera.position.z;
      camera.position.z = Math.max(zEnd, camera.position.z - CFG.speed * dt);
      const prog = (zStart - camera.position.z) / (zStart - zEnd);
      document.getElementById('prog').style.width = Math.min(100, prog * 100) + '%';
      if (camera.position.z <= zEnd + 0.001) setTimeout(showEnd, 900);
      if (!hintHidden && prog > 0.06) {
        hintHidden = true;
        document.getElementById('hint').style.opacity = 0;
      }
      // 相机轻微起伏
      camera.position.y = 1.62 + Math.sin(now * 0.0006) * 0.028;
    }

    yaw += (yawT - yaw) * Math.min(1, dt * 9);
    pitch += (pitchT - pitch) * Math.min(1, dt * 9);
    const sway = Math.sin(now * 0.00042) * 0.028;
    const dir = new THREE.Vector3(
      Math.sin(yaw + sway) * Math.cos(pitch),
      Math.sin(pitch) + 0.02,
      -Math.cos(yaw + sway) * Math.cos(pitch)
    );
    camera.lookAt(camera.position.clone().add(dir));

    // 光点缓慢飘动
    const pa = dust.geometry.attributes.position;
    for (let i = 0; i < DUST; i++) {
      pa.array[i * 3 + 1] += Math.sin(now * 0.0007 + dseed[i]) * 0.0016;
      pa.array[i * 3] += Math.cos(now * 0.0005 + dseed[i]) * 0.0012;
    }
    pa.needsUpdate = true;

    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
