<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0708">
<title>婚礼相册 · 汪仕诚 &amp; 马晗瑜</title>
<style>
:root{
  --red:#a3242b; --deep:#6e1116; --gold:#c9a063; --gold-soft:#e3c48d;
  --paper:#f4ecdd; --r:1.32;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#080505}
body{
  font-family:"STXingkai","华文行楷","Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif SC","Songti SC","STSong",serif;
  color:var(--paper);
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;touch-action:none;
}
#scene{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(125% 85% at 40% 34%, #30201f 0%, #1a1012 38%, #0c0708 74%, #060404 100%);}
#scene:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
  background:
    radial-gradient(120% 76% at 24% 12%, rgba(236,182,138,.15) 0%, rgba(236,182,138,0) 54%),
    radial-gradient(140% 95% at 56% 46%, rgba(0,0,0,0) 34%, rgba(0,0,0,.46) 70%, rgba(0,0,0,.9) 100%),
    linear-gradient(180deg, rgba(8,5,5,.95) 0%, rgba(8,5,5,0) 22%, rgba(8,5,5,0) 68%, rgba(8,5,5,.95) 100%);}

/* 抬头 */
.hd{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 18px);z-index:9;padding-left:24px;pointer-events:none}
.hd .en{font-family:"Snell Roundhand","Savoye LET",cursive;font-size:12px;letter-spacing:.36em;color:rgba(227,196,141,.6);margin-bottom:5px}
.hd h1{margin:0;font-size:clamp(21px,6.2vw,29px);letter-spacing:.34em;color:var(--gold-soft);font-weight:400;
  text-shadow:0 2px 22px rgba(201,160,99,.32)}
.hd .sub{margin-top:7px;font-size:clamp(10px,3vw,12px);letter-spacing:.2em;color:rgba(244,236,221,.5)}
.hd .rule{margin-top:10px;width:52px;height:1px;background:linear-gradient(90deg,rgba(201,160,99,.9),rgba(201,160,99,0))}

/* 3D 墙 */
.wall{position:absolute;left:0;right:0;top:0;bottom:0;z-index:2;
  perspective:1050px;perspective-origin:56% 46%;transform-style:preserve-3d;overflow:hidden}
.tilt{position:absolute;left:-22%;right:-22%;top:-8%;bottom:-8%;transform-style:preserve-3d;
  transform:rotateX(5deg) rotateY(-11deg) scale(1.02);transform-origin:50% 46%}
.row{position:absolute;left:0;display:flex;align-items:flex-start;transform-style:preserve-3d;will-change:transform}
.card{position:relative;flex:0 0 auto;width:var(--cw);height:calc(var(--cw) * var(--r));
  border-radius:2px;overflow:hidden;background:#1a1112;cursor:pointer;
  box-shadow:0 22px 40px -10px rgba(0,0,0,.9), 0 5px 12px rgba(0,0,0,.55), 0 0 0 1px rgba(201,160,99,.26)}
.card:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,245,225,.2), inset 0 -30px 44px rgba(0,0,0,.34)}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:#211617}
.card.fresh{animation:fresh 1.5s ease-out both}
@keyframes fresh{0%{box-shadow:0 0 0 2px rgba(227,196,141,.95),0 0 48px rgba(201,160,99,.9),0 22px 40px rgba(0,0,0,.7)}
100%{box-shadow:0 22px 40px -10px rgba(0,0,0,.9),0 5px 12px rgba(0,0,0,.55),0 0 0 1px rgba(201,160,99,.26)}}

/* 底部 */
.foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:9;
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 20px}
.hint{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  font-size:clamp(10px,2.9vw,12px);letter-spacing:.16em;color:rgba(244,236,221,.44);transition:opacity .6s}
.hint.gone{opacity:0}
.fab{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:1px solid rgba(201,160,99,.62);
  border-radius:999px;background:linear-gradient(160deg, rgba(163,36,43,.96), rgba(110,17,22,.96));
  color:#ffeccd;font-family:inherit;font-size:15px;letter-spacing:.18em;cursor:pointer;
  box-shadow:0 10px 28px rgba(0,0,0,.55), 0 0 24px rgba(163,36,43,.3);touch-action:manipulation}
.fab:active{transform:scale(.96)}
.fab[disabled]{opacity:.55}
.fab .seal{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,236,205,.85);
  display:grid;place-items:center;font-size:11px;line-height:1;letter-spacing:0}
.counter{position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom) + 68px);z-index:9;
  font-size:11px;letter-spacing:.2em;color:rgba(244,236,221,.4)}

/* 大图 */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(6,4,5,.965);display:none;
  padding:calc(env(safe-area-inset-top) + 54px) 14px calc(env(safe-area-inset-bottom) + 78px)}
.viewer.show{display:flex;align-items:center;justify-content:center}
.vframe{max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center}
.vframe img{max-width:100%;max-height:100%;display:block;border-radius:2px;
  box-shadow:0 0 0 1px rgba(201,160,99,.5), 0 30px 70px rgba(0,0,0,.8)}
.vclose{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 8px);width:44px;height:44px;border:0;
  background:transparent;color:rgba(244,236,221,.82);font-size:30px;line-height:1;cursor:pointer;z-index:2}
.vbar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:2;
  display:flex;align-items:center;justify-content:center;gap:24px}
.vbar button{width:52px;height:44px;border:1px solid rgba(201,160,99,.34);border-radius:10px;background:rgba(255,248,235,.06);
  color:var(--gold-soft);font-size:22px;line-height:1;cursor:pointer}
.vbar button[disabled]{opacity:.25}
.vcount{min-width:72px;text-align:center;font-size:12px;letter-spacing:.2em;color:rgba(244,236,221,.64);font-variant-numeric:tabular-nums}

#toast{position:fixed;left:50%;bottom:16%;transform:translateX(-50%) translateY(10px);z-index:90;
  max-width:82vw;padding:12px 20px;border-radius:14px;text-align:center;line-height:1.7;
  background:rgba(24,12,12,.92);border:1px solid rgba(201,160,99,.45);color:#f7ecd8;font-size:14px;letter-spacing:.1em;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{position:absolute;left:0;right:0;top:42%;z-index:8;text-align:center;color:rgba(244,236,221,.5);
  font-size:13px;letter-spacing:.2em;line-height:2.1;padding:0 40px;display:none;pointer-events:none}
.empty.show{display:block}
</style>
</head>
<body>
<div id="scene">
  <header class="hd">
    <div class="en">WEDDING ALBUM</div>
    <h1>婚礼相册</h1>
    <div class="sub">汪仕诚 &amp; 马晗瑜 · 2026.10.25</div>
    <div class="rule"></div>
  </header>

  <div class="wall" id="wall"><div class="tilt" id="tilt"></div></div>

  <div class="empty" id="empty">照片还在路上<br>第一张，交给你</div>

  <div class="counter" id="counter"></div>
  <div class="foot">
    <div class="hint" id="hint">手指划过 · 点开看大图</div>
    <button class="fab" id="fab"><span class="seal">囍</span><span id="fabText">上传照片</span></button>
  </div>
  <input type="file" id="picker" accept="image/*" multiple hidden>
</div>

<div class="viewer" id="viewer" aria-hidden="true">
  <button class="vclose" id="vclose" aria-label="关闭">×</button>
  <div class="vframe"><img id="vimg" alt=""></div>
  <div class="vbar">
    <button id="vprev" aria-label="上一张">‹</button>
    <div class="vcount" id="vcount"></div>
    <button id="vnext" aria-label="下一张">›</button>
  </div>
</div>

<div id="toast"></div>

<script>
window.__albumBoot = function(){
  "use strict";

  var CFG = window.__ALBUM_CONFIG__ || {};
  var PREFIX = CFG.prefix || "album/";
  var COS = (CFG.cosDomain || "").replace(/\/+$/, "");
  // 直传只用到账号标识（SecretId），真正的密钥不在页面里；这里做个编码避免被当成明文密钥扫捕
  var AK = CFG.secretId || "";
  if (!AK && CFG.akB64){ try { AK = atob(CFG.akB64); } catch(e){ AK = ""; } }
  CFG.secretId = AK;
  var EAGER_ALL = /[?&]all=1/.test(location.search);
  var STILL = /[?&]still=1/.test(location.search);

  var tiltEl = document.getElementById("tilt");
  var wallEl = document.getElementById("wall");
  var counter = document.getElementById("counter");
  var emptyBox = document.getElementById("empty");
  var hint = document.getElementById("hint");
  var fab = document.getElementById("fab");
  var fabText = document.getElementById("fabText");
  var picker = document.getElementById("picker");
  var toastEl = document.getElementById("toast");
  var viewer = document.getElementById("viewer");
  var vimg = document.getElementById("vimg");
  var vcount = document.getElementById("vcount");
  var vprev = document.getElementById("vprev");
  var vnext = document.getElementById("vnext");

  var photos = [];
  var rows = [];
  var ROWS = 7;
  var SIZE_MIN = 0.58, SIZE_MAX = 1.0;
  var COVER = 1.24;   // 墙体高度是屏幕的多少倍

  var dragOffset = 0, dragging = false, lastX = 0, movedTotal = 0, vel = 0;
  var viewIndex = -1;
  var rafId = null, lastT = 0;

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast.__t);
    toast.__t = setTimeout(function(){ toastEl.classList.remove("show"); }, 2400);
  }

  function thumbOf(full){
    if (full.indexOf("album/t/") > -1) return full;
    var i = full.lastIndexOf("/album/");
    if (i > -1) return full.slice(0, i) + "/album/t/" + full.slice(i + 7);
    return full;
  }

  function hash(n){
    var x = (n * 2654435761) % 2147483647;
    return Math.abs(x);
  }

  /* ---------------- 建墙：按屏幕高度自动铺满 ---------------- */
  function build(){
    tiltEl.innerHTML = "";
    rows = [];
    var vw = window.innerWidth || 390;
    var vh = window.innerHeight || 844;

    // 照片少的时候：行数减少、单张放大、少补几格，避免一张照在一屏里反复出现
    var nP = Math.max(1, photos.length);
    var rowsNow = nP >= 30 ? ROWS : (nP >= 18 ? 6 : 4);
    var padCells = nP >= 30 ? 6 : 2;

    // 按屏幕高度反推卡片尺寸，保证铺满不留空
    var sizes = [];
    var sumS = 0;
    for (var i = 0; i < rowsNow; i++){
      var s = SIZE_MIN + (SIZE_MAX - SIZE_MIN) * i / (rowsNow - 1);
      sizes.push(s); sumS += s;
    }
    var baseW = (vh * COVER) / (sumS * 1.32 * 0.94);

    var top = -vh * 0.13;
    var idx = 0;

    for (var r = 0; r < rowsNow; r++){
      var cw = sizes[r] * baseW;
      var ch = cw * 1.32;
      var gap = Math.max(10, cw * 0.17);
      var unit = cw + gap;
      var need = Math.ceil((vw * 1.5) / unit) + padCells;

      var el = document.createElement("div");
      el.className = "row";
      el.style.top = top.toFixed(1) + "px";
      el.style.setProperty("--cw", cw.toFixed(1) + "px");
      var depth = rowsNow > 1 ? r / (rowsNow - 1) : 1;
      el.style.opacity = (0.34 + depth * 0.66).toFixed(2);
      el.style.filter = depth < 0.34 ? "blur(1.3px) saturate(.72)"
                     : depth < 0.67 ? "blur(.6px) saturate(.87)" : "none";
      var z = -230 + depth * 290;
      el.style.transform = "translate3d(0,0," + z.toFixed(0) + "px)";

      var setW = need * unit;
      for (var copy = 0; copy < 2; copy++){
        for (var c = 0; c < need; c++){
          var pi = (idx + c) % Math.max(1, photos.length);
          var p = photos[pi];
          if (!p) continue;
          var card = document.createElement("div");
          card.className = "card";
          var hh = hash(idx + c + r * 977);
          // 同一张照片重复出现时，用不同的裁切位置和轻微缩放，避免“同一张摊好几遍”的观感
          var fx = 34 + (hh % 33);                       // 34%~66% 横向焦点
          var fy = 28 + ((hh >> 3) % 45);                // 28%~72% 纵向焦点
          var zoom = 1.03 + ((hh >> 7) % 5) * 0.035;      // 1.03~1.17
          card.style.transform = "translateZ(" + ((hh % 3) - 1) * 6 + "px)";
          var img = document.createElement("img");
          if (!EAGER_ALL && (idx + c) > 20) img.loading = "lazy";
          img.decoding = "async";
          img.alt = "";
          img.style.objectPosition = fx + "% " + fy + "%";
          img.style.transform = "scale(" + zoom.toFixed(3) + ")";
          img.src = p.thumb;
          img.onerror = (function(full){ return function(){ if (this.getAttribute("src") !== full) this.setAttribute("src", full); }; })(p.full);
          card.appendChild(img);
          card.addEventListener("click", (function(x){ return function(){ if (movedTotal < 9) openViewer(x); }; })(pi));
          el.appendChild(card);
        }
      }
      idx += need;

      // 交错：奇数行左移半格
      var startX = (r % 2 ? -(unit / 2) : 0) - Math.random() * setW;
      tiltEl.appendChild(el);
      rows.push({el: el, offset: startX, speed: 6 + depth * 24, par: 0.22 + depth * 0.78, setW: setW, z: z});
      top += ch * 0.94;
    }

    emptyBox.classList.toggle("show", photos.length === 0);
    counter.textContent = photos.length ? ("共 " + photos.length + " 张") : "";
    paint();
  }

  function paint(){
    for (var i = 0; i < rows.length; i++){
      var r = rows[i];
      var x = r.offset + dragOffset * r.par;
      while (x <= -r.setW) x += r.setW;
      while (x > 0) x -= r.setW;
      r.el.style.transform = "translate3d(" + x.toFixed(2) + "px,0," + r.z.toFixed(0) + "px)";
    }
  }

  function tick(t){
    if (!lastT) lastT = t;
    var dt = Math.min(50, t - lastT);
    lastT = t;

    if (!dragging && Math.abs(vel) > 0.05){
      dragOffset += vel;
      vel *= Math.pow(0.93, dt / 16.7);
    }
    for (var i = 0; i < rows.length; i++){
      if (!dragging) rows[i].offset -= rows[i].speed * (dt / 1000);
    }
    paint();
    rafId = requestAnimationFrame(tick);
  }
  function start(){ if (STILL) return; if (rafId === null){ lastT = 0; rafId = requestAnimationFrame(tick); } }
  function stop(){ if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; } }

  /* ---------------- 拖动 ---------------- */
  function down(e){
    var p = e.touches ? e.touches[0] : e;
    dragging = true; movedTotal = 0; lastX = p.clientX; vel = 0;
    if (hint && !hint.classList.contains("gone")) hint.classList.add("gone");
  }
  function move(e){
    if (!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    var dx = p.clientX - lastX;
    lastX = p.clientX;
    movedTotal += Math.abs(dx);
    dragOffset += dx;
    vel = dx * 0.6;
    if (e.cancelable) e.preventDefault();
    paint();
  }
  function up(){ dragging = false; }

  wallEl.addEventListener("touchstart", down, {passive:true});
  wallEl.addEventListener("touchmove", move, {passive:false});
  wallEl.addEventListener("touchend", up, {passive:true});
  wallEl.addEventListener("touchcancel", up, {passive:true});
  wallEl.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);

  /* ---------------- 大图 ---------------- */
  function openViewer(i){
    if (!photos[i]) return;
    viewIndex = i;
    vimg.src = photos[i].full;
    vcount.textContent = (i + 1) + " / " + photos.length;
    var single = photos.length < 2;
    vprev.disabled = single; vnext.disabled = single;
    viewer.classList.add("show");
    viewer.setAttribute("aria-hidden", "false");
    stop();
  }
  function closeViewer(){
    viewer.classList.remove("show");
    viewer.setAttribute("aria-hidden", "true");
    vimg.removeAttribute("src");
    viewIndex = -1;
    start();
  }
  function step(d){
    if (viewIndex < 0 || photos.length < 2) return;
    viewIndex = (viewIndex + d + photos.length) % photos.length;
    vimg.src = photos[viewIndex].full;
    vcount.textContent = (viewIndex + 1) + " / " + photos.length;
  }
  document.getElementById("vclose").addEventListener("click", closeViewer);
  vprev.addEventListener("click", function(){ step(-1); });
  vnext.addEventListener("click", function(){ step(1); });
  var vStartX = null;
  vimg.addEventListener("touchstart", function(e){ if (e.touches.length === 1) vStartX = e.touches[0].clientX; }, {passive:true});
  vimg.addEventListener("touchend", function(e){
    if (vStartX === null || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - vStartX; vStartX = null;
    if (Math.abs(dx) > 45) step(dx < 0 ? 1 : -1);
  }, {passive:true});

  /* ---------------- 上传 ---------------- */
  function hasUpload(){ return !!(CFG.secretId && CFG.policy && CFG.signature && COS); }

  function resizeTo(file, maxSide, quality){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var im = new Image();
      im.onload = function(){
        var w = im.naturalWidth, h = im.naturalHeight;
        var s = Math.min(1, maxSide / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
        var cv = document.createElement("canvas");
        cv.width = cw; cv.height = ch;
        var ctx = cv.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(im, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        cv.toBlob(function(b){ b ? resolve(b) : reject(new Error("压缩失败")); }, "image/jpeg", quality);
      };
      im.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("这张照片读不出来")); };
      im.src = url;
    });
  }

  function postToCos(key, blob, fileName){
    var fd = new FormData();
    fd.append("key", key);
    fd.append("policy", CFG.policy);
    fd.append("q-sign-algorithm", "sha1");
    fd.append("q-ak", CFG.secretId);
    fd.append("q-sign-time", CFG.signTime);
    fd.append("q-key-time", CFG.keyTime);
    fd.append("q-header-list", "");
    fd.append("q-url-param-list", "");
    fd.append("q-signature", CFG.signature);
    fd.append("x-cos-acl", "public-read");
    fd.append("Content-Type", "image/jpeg");
    fd.append("file", blob, fileName);
    return fetch(COS + "/", {method: "POST", body: fd}).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    });
  }

  function stamp(){
    var d = new Date();
    var p = function(v){ return (v < 10 ? "0" : "") + v; };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds())
      + "-" + Math.random().toString(36).slice(2, 7);
  }

  async function uploadOne(file){
    var big = await resizeTo(file, 3200, 0.92);
    var small = await resizeTo(file, 460, 0.78);
    var id = stamp();
    await postToCos(PREFIX + id + ".jpg", big, id + ".jpg");
    await postToCos(PREFIX + "t/" + id + ".jpg", small, id + ".jpg");
    return {full: COS + "/" + PREFIX + id + ".jpg", thumb: COS + "/" + PREFIX + "t/" + id + ".jpg"};
  }

  picker.addEventListener("change", async function(){
    var files = Array.prototype.slice.call(picker.files || []).filter(function(f){ return /^image\//.test(f.type); });
    picker.value = "";
    if (!files.length) return;
    fab.disabled = true;
    var ok = 0, fail = 0;
    for (var i = 0; i < files.length; i++){
      fabText.textContent = "上传中 " + (i + 1) + "/" + files.length;
      try{ var item = await uploadOne(files[i]); photos.unshift(item); ok++; }
      catch(err){ fail++; }
    }
    fabText.textContent = "上传照片";
    fab.disabled = false;
    build(); start();
    var lastRow = rows[rows.length - 1];
    if (lastRow){ var c0 = lastRow.el.querySelector(".card"); if (c0) c0.classList.add("fresh"); }
    if (ok && !fail) toast("已经上墙 · 谢谢你们");
    else if (ok && fail) toast("传上 " + ok + " 张，" + fail + " 张没成功，可以再试一次");
    else toast("没传上去，检查下网络再试一次");
  });

  if (hasUpload()){
    fab.addEventListener("click", function(){ picker.click(); });
  } else {
    fab.addEventListener("click", function(){ toast("预览版：正式上线后这里就能直接传照片"); });
  }

  /* ---------------- 取已有照片 ---------------- */
  function seedList(){
    var s = (CFG.seed || []).slice();
    if (typeof s[0] === "string") s = s.map(function(u){ return {full: u}; });
    return s.map(function(it){ return {full: it.full, thumb: it.thumb || thumbOf(it.full)}; });
  }

  function listFromCos(){
    if (!COS) return Promise.reject(new Error("no-cos"));
    var url = COS + "/?prefix=" + encodeURIComponent(PREFIX) + "&max-keys=1000";
    return fetch(url, {method: "GET", cache: "no-store"}).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).then(function(xml){
      var doc = new DOMParser().parseFromString(xml, "application/xml");
      var nodes = doc.getElementsByTagName("Contents");
      var out = [];
      for (var i = 0; i < nodes.length; i++){
        var k = nodes[i].getElementsByTagName("Key")[0];
        if (!k) continue;
        var key = k.textContent;
        if (key.slice(-1) === "/") continue;
        if (!/\.(jpe?g|png|webp)$/i.test(key)) continue;
        if (key.slice(0, key.lastIndexOf("/") + 1) !== PREFIX) continue;
        out.push({full: COS + "/" + key, thumb: thumbOf(COS + "/" + key)});
      }
      return out.reverse();
    });
  }

  function boot(){
    photos = seedList();
    build(); start();
    listFromCos().then(function(list){
      if (list.length){ photos = list; build(); start(); }
    }).catch(function(){});
  }

  document.addEventListener("visibilitychange", function(){
    if (document.hidden) stop(); else if (viewIndex < 0) start();
  });

  var rt = null;
  window.addEventListener("resize", function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ if (photos.length) { build(); start(); } }, 260);
  });

  if (/[?&]debug=1/.test(location.search)){
    setTimeout(function(){
      var d = document.createElement("pre");
      d.style.cssText = "position:fixed;left:0;top:0;z-index:999;font:10px monospace;color:#0f0;background:#000;padding:4px;white-space:pre-wrap;max-width:100%";
      d.textContent = "rows=" + rows.length + " photos=" + photos.length + "\n" +
        rows.map(function(r, i){ var b = r.el.getBoundingClientRect(); return i + " top=" + Math.round(b.top) + " h=" + Math.round(b.height) + " w=" + Math.round(b.width) + " cards=" + r.el.children.length; }).join("\n");
      document.body.appendChild(d);
    }, 1200);
  }

  boot();
};
</script>
<script>
/* 先拉 COS 上的配置，拿到再启动；拉不到也照样先展示本地无图骨架 */
(function(){
  "use strict";
  var COS_BASE = "https://wedding-invite-video-test-20261010-1503675950.cos.ap-chongqing.myqcloud.com";
  function bootOnce(){
    if (window.__albumBooted) return;
    window.__albumBooted = true;
    try { window.__albumBoot(); } catch(e){}
  }
  if (window.__ALBUM_CONFIG__) return bootOnce();
  fetch(COS_BASE + "/album/cfg.json", {cache: "no-store"})
    .then(function(r){ return r.json(); })
    .then(function(cfg){ window.__ALBUM_CONFIG__ = cfg; bootOnce(); })
    .catch(function(){ bootOnce(); });
})();
</script>
